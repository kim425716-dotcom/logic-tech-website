<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password – Logic Tech</title>
  <link rel="icon" href="assets/logo.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-glow-1"></div>
    <div class="auth-glow-2"></div>

    <div class="auth-card" id="mainCard">
      <div class="auth-logo">
        <a href="index.html">
          <img src="assets/logo.png" alt="Logic Tech Logo" />
          <span>Logic<span class="accent">Tech</span></span>
        </a>
        <h1 id="authTitle">Forgot Password?</h1>
        <p id="authDescription">Enter your email and we'll send a reset link.</p>
      </div>

      <div id="forgotError" class="hidden" style="background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.3);color:#fca5a5;font-size:0.8125rem;padding:0.75rem 1rem;border-radius:10px;margin-bottom:0.5rem;"></div>
      <form class="auth-form" id="forgotForm">
        <div class="form-group">
          <label>Email Address</label>
          <div class="input-wrap">
            <i class="fa-solid fa-envelope input-icon"></i>
            <input type="email" id="forgotEmail" placeholder="you@company.com" required />
          </div>
        </div>
        <button type="submit" class="btn btn-primary" id="forgotBtn">
          Send Reset Link <i class="fa-solid fa-paper-plane"></i>
        </button>
      </form>

      <form class="auth-form hidden" id="resetForm">
        <div class="form-group">
          <label>New Password</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="resetPassword" minlength="10" required />
          </div>
        </div>
        <button type="submit" class="btn btn-primary" id="resetBtn">Update Password</button>
      </form>

      <div id="forgotSuccess" class="hidden" style="text-align:center;padding:2rem 0;">
        <div style="width:56px;height:56px;border-radius:50%;background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.3);display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;font-size:1.75rem;color:#34d399;">
          <i class="fa-solid fa-envelope-circle-check"></i>
        </div>
        <h3 style="color:var(--text-primary);font-size:1.25rem;margin-bottom:0.5rem;">Check your inbox!</h3>
        <p style="color:var(--text-muted);font-size:0.875rem;">We've sent a password reset link to your email address.</p>
      </div>

      <p class="auth-footer">
        Remember your password? <a href="login.html">Sign in</a>
      </p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.getElementById('forgotForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('forgotBtn');
      btn.textContent = 'Sending...';
      btn.disabled = true;
      const errorBox = document.getElementById('forgotError');
      errorBox.classList.add('hidden');
      try {
        const response = await apiFetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('forgotEmail').value })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Unable to request a reset link.');
        document.getElementById('forgotForm').classList.add('hidden');
        document.getElementById('forgotSuccess').classList.remove('hidden');
      } catch (error) {
        errorBox.textContent = error.message || 'The server could not be reached. Please try again.';
        errorBox.classList.remove('hidden');
        btn.textContent = 'Send Reset Link';
        btn.disabled = false;
      }
    });

    const resetToken = new URLSearchParams(window.location.search).get('token');
    if (resetToken) {
      document.getElementById('authTitle').textContent = 'Choose a New Password';
      document.getElementById('authDescription').textContent = 'Use at least 10 characters for your new password.';
      document.getElementById('forgotForm').classList.add('hidden');
      document.getElementById('resetForm').classList.remove('hidden');
      document.getElementById('forgotSuccess').classList.add('hidden');
    }

    document.getElementById('resetForm')?.addEventListener('submit', async event => {
      event.preventDefault();
      const button = document.getElementById('resetBtn');
      const errorBox = document.getElementById('forgotError');
      errorBox.classList.add('hidden');
      button.disabled = true;
      button.textContent = 'Updating...';
      try {
        const response = await apiFetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            token: resetToken,
            password: document.getElementById('resetPassword').value
          })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Unable to update your password.');
        document.getElementById('resetForm').classList.add('hidden');
        document.querySelector('#forgotSuccess h3').textContent = 'Password updated';
        document.querySelector('#forgotSuccess p').textContent = 'Your password has been changed. You can now sign in.';
        document.getElementById('forgotSuccess').classList.remove('hidden');
      } catch (error) {
        errorBox.textContent = error.message || 'The server could not be reached. Please try again.';
        errorBox.classList.remove('hidden');
        button.disabled = false;
        button.textContent = 'Update Password';
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account – Logic Tech</title>
  <link rel="icon" href="assets/logo.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

  <div class="auth-page">
    <div class="auth-glow-1"></div>
    <div class="auth-glow-2"></div>

    <div class="auth-card">
      <div class="auth-logo">
        <a href="index.html">
          <img src="assets/logo.png" alt="Logic Tech Logo" />
          <span>Logic<span class="accent">Tech</span></span>
        </a>
        <h1>Create your account</h1>
        <p>Join leading businesses building with Logic Tech</p>
      </div>

      <div id="regError" class="hidden" style="
        background: rgba(239,68,68,0.12);
        border: 1px solid rgba(239,68,68,0.3);
        color: #fca5a5;
        font-size: 0.8125rem;
        padding: 0.75rem 1rem;
        border-radius: 10px;
        margin-bottom: 0.5rem;
      "></div>

      <form class="auth-form" id="registerForm">
        <div class="form-group">
          <label>Full Name</label>
          <div class="input-wrap">
            <i class="fa-solid fa-user input-icon"></i>
            <input type="text" id="regName" placeholder="John Doe" required />
          </div>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <div class="input-wrap">
            <i class="fa-solid fa-envelope input-icon"></i>
            <input type="email" id="regEmail" placeholder="you@company.com" required />
          </div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="regPassword" placeholder="At least 10 characters" minlength="10" required />
            <button type="button" class="pw-toggle" id="regPwToggle">
              <i class="fa-solid fa-eye" id="regPwIcon"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="registerBtn">
          Create Account <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <p class="auth-footer" style="margin-top:1rem; font-size:0.75rem; color:var(--text-muted); text-align:center;">
        By creating an account you agree to our
        <a href="terms.html" style="color:#a78bfa;">Terms of Service</a> and
        <a href="privacy.html" style="color:#a78bfa;">Privacy Policy</a>.
      </p>

      <p class="auth-footer">
        Already have an account? <a href="login.html">Sign in</a>
      </p>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script>
    // Password toggle
    document.getElementById('regPwToggle')?.addEventListener('click', () => {
      const input = document.getElementById('regPassword');
      const icon  = document.getElementById('regPwIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    });

    document.getElementById('registerForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name     = document.getElementById('regName').value.trim();
      const email    = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const btn      = document.getElementById('registerBtn');
      const errBox   = document.getElementById('regError');

      if (!name || !email || !password) {
        errBox.textContent = 'Please fill in all fields.';
        errBox.classList.remove('hidden');
        return;
      }
      if (password.length < 10) {
        errBox.textContent = 'Password must be at least 10 characters.';
        errBox.classList.remove('hidden');
        return;
      }

      errBox.classList.add('hidden');
      btn.textContent = 'Creating account...';
      btn.disabled = true;

      try {
        const response = await apiFetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Unable to create your account.');
        window.location.href = 'dashboard-client.html';
      } catch (error) {
        errBox.textContent = error.message || 'The server could not be reached. Please try again.';
        errBox.classList.remove('hidden');
        btn.innerHTML = 'Create Account <i class="fa-solid fa-arrow-right"></i>';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>

  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script>
    // Password toggle
    document.getElementById('regPwToggle')?.addEventListener('click', () => {
      const input = document.getElementById('regPassword');
      const icon  = document.getElementById('regPwIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    });

    document.getElementById('registerForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name     = document.getElementById('regName').value.trim();
      const email    = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const btn      = document.getElementById('registerBtn');
      const errBox   = document.getElementById('regError');

      if (!name || !email || !password) {
        errBox.textContent = 'Please fill in all fields.';
        errBox.classList.remove('hidden');
        return;
      }
      if (password.length < 10) {
        errBox.textContent = 'Password must be at least 10 characters.';
        errBox.classList.remove('hidden');
        return;
      }

      errBox.classList.add('hidden');
      btn.textContent = 'Creating account...';
      btn.disabled = true;

      try {
        const response = await apiFetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Unable to create your account.');
        window.location.href = 'dashboard-client.html';
      } catch (error) {
        errBox.textContent = error.message || 'The server could not be reached. Please try again.';
        errBox.classList.remove('hidden');
        btn.innerHTML = 'Create Account <i class="fa-solid fa-arrow-right"></i>';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>

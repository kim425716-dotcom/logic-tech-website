<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In – Logic Tech</title>
  <link rel="icon" href="assets/logo.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

  <div class="auth-page">
    <div class="auth-glow-1"></div>
    <div class="auth-glow-2"></div>

    <div class="auth-card">
      <div class="auth-logo">
        <a href="index.html">
          <img src="assets/logo.png" alt="Logic Tech Logo" />
          <span>Logic<span class="accent">Tech</span></span>
        </a>
        <h1>Welcome back</h1>
        <p>Sign in to your account</p>
      </div>

      <div id="loginError" class="hidden" style="
        background: rgba(239,68,68,0.12);
        border: 1px solid rgba(239,68,68,0.3);
        color: #fca5a5;
        font-size: 0.8125rem;
        padding: 0.75rem 1rem;
        border-radius: 10px;
        margin-bottom: 0.5rem;
      "></div>

      <form class="auth-form" id="loginForm">
        <div class="form-group">
          <label>Email Address</label>
          <div class="input-wrap">
            <i class="fa-solid fa-envelope input-icon"></i>
            <input type="email" id="loginEmail" placeholder="alice@example.com" required />
          </div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="loginPassword" placeholder="Your password" required />
            <button type="button" class="pw-toggle" id="pwToggle">
              <i class="fa-solid fa-eye" id="pwIcon"></i>
            </button>
          </div>
        </div>
        <div class="auth-row">
          <label>
            <input type="checkbox" />
            Remember me
          </label>
          <a href="forgot-password.html">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary" id="loginBtn">
          Sign In <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <!-- Demo shortcuts -->
      <div class="auth-demo">
        <p>Quick demo logins:</p>
        <div class="auth-demo-btns">
          <button class="auth-demo-btn" onclick="fillDemo('alice@example.com','demo123')">Client</button>
          <button class="auth-demo-btn" onclick="fillDemo('carol@logictech.io','demo123')">Admin</button>
        </div>
      </div>

      <p class="auth-footer">
        Don't have an account? <a href="register.html">Sign up free</a>
      </p>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script>
    // Password toggle
    document.getElementById('pwToggle')?.addEventListener('click', () => {
      const input = document.getElementById('loginPassword');
      const icon  = document.getElementById('pwIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    });

    // Demo fill
    function fillDemo(email, pw) {
      document.getElementById('loginEmail').value = email;
      document.getElementById('loginPassword').value = pw;
    }
    window.fillDemo = fillDemo;

    // Login submit (demo logic — replace with real API call)
    document.getElementById('loginForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email    = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const btn      = document.getElementById('loginBtn');
      const errBox   = document.getElementById('loginError');

      btn.textContent = 'Signing in...';
      btn.disabled = true;
      errBox.classList.add('hidden');

      await new Promise(r => setTimeout(r, 1200));

      // Demo credentials check
      const validUsers = {
        'alice@example.com': { pw: 'demo123', role: 'client', name: 'Alice Wanjiku' },
        'carol@logictech.io': { pw: 'demo123', role: 'admin', name: 'Carol Admin' },
      };
      const user = validUsers[email];

      if (user && user.pw === password) {
        localStorage.setItem('lt-user', JSON.stringify({ email, name: user.name, role: user.role }));
        showToast('Welcome back, ' + user.name.split(' ')[0] + '!', 'success');
        setTimeout(() => {
          window.location.href = user.role === 'admin' ? 'dashboard-admin.html' : 'dashboard-client.html';
        }, 800);
      } else {
        errBox.textContent = 'Invalid email or password. Try a demo login below.';
        errBox.classList.remove('hidden');
        btn.innerHTML = 'Sign In <i class="fa-solid fa-arrow-right"></i>';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>

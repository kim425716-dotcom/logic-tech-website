<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In – Logic Tech</title>
  <link rel="icon" href="assets/logo.png" />
  <link rel="stylesheet" href="css/style.css?v=2.2" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

  <div class="auth-page">
    <div class="auth-glow-1"></div>
    <div class="auth-glow-2"></div>

    <div class="auth-card">
      <div class="auth-logo">
        <a href="index.html">
          <img src="assets/logo.png" alt="Logic Tech Logo" />
          <span>Logic<span class="accent">Tech</span></span>
        </a>
        <h1>Welcome back</h1>
        <p>Sign in to your account</p>
      </div>

      <div id="loginError" class="hidden" style="
        background: rgba(239,68,68,0.12);
        border: 1px solid rgba(239,68,68,0.3);
        color: #fca5a5;
        font-size: 0.8125rem;
        padding: 0.75rem 1rem;
        border-radius: 10px;
        margin-bottom: 0.5rem;
      "></div>

      <form class="auth-form" id="loginForm">
        <div class="form-group">
          <label>Email Address</label>
          <div class="input-wrap">
            <i class="fa-solid fa-envelope input-icon"></i>
            <input type="email" id="loginEmail" placeholder="alice@example.com" required />
          </div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="loginPassword" placeholder="Your password" required />
            <button type="button" class="pw-toggle" id="pwToggle">
              <i class="fa-solid fa-eye" id="pwIcon"></i>
            </button>
          </div>
        </div>
        <div class="auth-row">
          <label>
            <input type="checkbox" />
            Remember me
          </label>
          <a href="forgot-password.html">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary" id="loginBtn">
          Sign In <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <p class="auth-footer">
        Don't have an account? <a href="register.html">Sign up free</a>
      </p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/main.js?v=2.2"></script>
  <script>
    // Password toggle
    document.getElementById('pwToggle')?.addEventListener('click', () => {
      const input = document.getElementById('loginPassword');
      const icon  = document.getElementById('pwIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    });

    document.getElementById('loginForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn      = document.getElementById('loginBtn');
      const errBox   = document.getElementById('loginError');

      errBox.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Signing in...';
      try {
        const response = await apiFetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('loginEmail').value,
            password: document.getElementById('loginPassword').value
          })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Unable to sign in.');
        if (result.user && result.user.role === 'admin') {
          window.location.href = 'dashboard-admin.html';
        } else {
          window.location.href = 'dashboard-client.html';
        }
      } catch (error) {
        errBox.textContent = error.message || 'The server could not be reached. Please try again.';
        errBox.classList.remove('hidden');
        btn.innerHTML = 'Sign In <i class="fa-solid fa-arrow-right"></i>';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
